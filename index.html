<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f3f2" />
    <meta name="description" content="Chill Notes — a calm place to type, sketch, and think." />
    <meta name="application-name" content="Chill Notes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chill Notes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>Chill Notes</title>
    <script>
      ;(() => {
        const storageKey = 'chill-notes-theme'
        let preference = 'system'

        try {
          const savedPreference = window.localStorage.getItem(storageKey)
          if (savedPreference === 'light' || savedPreference === 'dark') {
            preference = savedPreference
          }
        } catch {
          // Storage can be unavailable in private or restricted browsing contexts.
        }

        const theme = preference === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference

        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#241a22' : '#f8f3f2'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
